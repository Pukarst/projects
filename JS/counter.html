<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter App</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: cursive;
      background: linear-gradient(45deg, #f56767, #c3c3c3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: rgb(30, 64, 128);
      text-align: center;
      transition: 0.4s ease;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 32px;
    }

    #count {
      font-size: 70px;
      margin: 20px 0;
      color: #222;
      background: #e9a6a6;
      padding: 20px 50px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      min-width: 120px;
      margin-bottom: 50px;
      transition: all 0.3s ease;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 12px 16px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      transform: scale(1.08);
    }

    .plus { background: green; color: white; }
    .minus { background: red; color: white; }
    .reset { background: grey; color: white; }
    .save { background: blue; color: white; }
    .load { background: skyblue; color: black; }
    .theme { background: black; color: white; }

    .dark-mode {
      background: linear-gradient(45deg, #090b0f, #8cafd6);
      color: white;
    }

    .dark-mode #count {
      background: rgba(0, 0, 0, 0.35);
      color: white;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }

    .dark-mode button {
      filter: brightness(0.95);
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .animate {
      animation: pop 0.2s ease;
    }
  </style>
</head>

<body>

  <h2><i class="fa-solid fa-calculator"></i> Counter App</h2>

  <p id="count"><i class="fa-solid fa-hashtag"></i> 0</p>

  <div class="buttons">

    <button class="plus" onclick="increaseCount()">
      <i class="fa-solid fa-plus"></i> Increase
    </button>

    <button class="minus" onclick="decreaseCount()">
      <i class="fa-solid fa-minus"></i> Decrease
    </button>

    <button class="reset" onclick="resetCount()">
      <i class="fa-solid fa-rotate"></i> Reset
    </button>

    <button class="save" onclick="saveCount()">
      <i class="fa-solid fa-floppy-disk"></i> Save
    </button>

    <button class="load" onclick="loadCount()">
      <i class="fa-solid fa-folder-open"></i> Load
    </button>

    <button class="theme" onclick="toggleTheme()" id="themeBtn">
      <i class="fa-solid fa-moon"></i> Dark
    </button>

  </div>

  <script>
    let count = 0;

    function updateCount() {
      const countEl = document.getElementById("count");

      countEl.innerHTML = `<i class="fa-solid fa-hashtag"></i> ${count}`;

      countEl.classList.remove("animate");
      void countEl.offsetWidth;
      countEl.classList.add("animate");
    }

    function increaseCount() {
      count++;
      updateCount();
    }

    function decreaseCount() {
      if (count > 0) {
        count--;
        updateCount();
      }
    }

    function resetCount() {
      count = 0;
      updateCount();
    }

    function saveCount() {
      localStorage.setItem("count", count);
    }

    function loadCount() {
      const saved = localStorage.getItem("count");
      if (saved !== null) {
        count = Number(saved);
      }
      updateCount();
    }

    function applyTheme(theme) {
      const btn = document.getElementById("themeBtn");

      if (theme === "dark") {
        document.body.classList.add("dark-mode");
        btn.innerHTML = `<i class="fa-solid fa-sun"></i> Light`;
      } else {
        document.body.classList.remove("dark-mode");
        btn.innerHTML = `<i class="fa-solid fa-moon"></i> Dark`;
      }
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle("dark-mode");
      const theme = isDark ? "dark" : "light";

      localStorage.setItem("theme", theme);
      applyTheme(theme);
    }

    window.onload = () => {
      const savedTheme = localStorage.getItem("theme") || "light";

      loadCount();
      applyTheme(savedTheme);
    };
  </script>

</body>
</html>
